name: Microgen Defold 1.14.1 CI

on:
  push:
    branches: [preview/defold]
    paths:
      - 'prototypes/defold/**'
      - '.github/workflows/defold-build.yml'
  pull_request:
    branches: [preview/defold]
    paths:
      - 'prototypes/defold/**'
      - '.github/workflows/defold-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Defold 1.14.1 Android ARM64 archive (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download Defold Bob 1.14.1
        run: curl -fsSL --retry 3 -o bob.jar https://github.com/defold/defold/releases/download/1.14.1/bob.jar
      - name: Verify project and compile Android ARM64 resources (no APK)
        working-directory: prototypes/defold
        run: |
          test -f game.project
          mkdir -p build/reports
          java -jar "$GITHUB_WORKSPACE/bob.jar" --platform arm64-android --archive --build-report-json build/reports/defold-arm64.json build
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microgen-defold-1.14.1-arm64-report
          path: prototypes/defold/build/reports/defold-arm64.json
          if-no-files-found: ignore
